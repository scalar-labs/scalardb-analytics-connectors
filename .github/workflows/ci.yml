name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The Nix store cache purges the versions it replaces.
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      # The development shells, which cache.nixos.org does not fully provide:
      # flake.nix builds the DuckDB the adapter targets from source. Only main
      # saves the cache, which pull requests restore.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.nix', 'flake.lock', 'devshell.toml', 'packaging/dependencies.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          purge-created: 0
          purge-primary-key: never
      - name: Check formatting
        run: nix develop --command cargo fmt --all -- --check
      - name: Build workspace
        run: nix develop --command cargo build --workspace --all-targets
      - name: Test workspace
        run: nix develop --command cargo test --workspace --all-features
      - name: Build DuckDB adapter
        run: |
          nix develop --command cargo build -p connector-api --features test-connector,postgresql
          nix develop --command cmake -S adapters/duckdb -B target/duckdb-adapter -G Ninja
          nix develop --command cmake --build target/duckdb-adapter
      - name: Test DuckDB adapter
        run: nix develop --command ctest --test-dir target/duckdb-adapter --output-on-failure
      - name: Lint workspace
        run: nix develop --command cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check dependency policy
        run: nix develop --command cargo deny check bans licenses
      - name: Verify MSRV build
        run: nix develop .#msrv --command cargo build --workspace --all-targets
      - name: Verify MSRV tests
        run: nix develop .#msrv --command cargo test --workspace
