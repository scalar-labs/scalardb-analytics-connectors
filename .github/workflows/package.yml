name: Package

# Builds and checks the distribution package of every platform, keeps it as a
# workflow artifact, and publishes it as a GitHub Release when a `v<version>`
# tag matching the workspace version is pushed, with the version's section of
# CHANGELOG.md as its notes.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build package
        run: packaging/linux/package.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Check package
        run: packaging/test/run-check.sh target/dist/*-${{ matrix.platform }}.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}
          path: target/dist/*.tgz
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      # The packaging shell builds nothing from source, so the job keeps no
      # Nix store cache: the distribution build takes DuckDB, and protobuf and
      # abseil as their prebuilt artifact, itself.
      - name: Build package
        run: nix develop .#package --command packaging/package.sh
      # Docker is unavailable on macOS runners, so the e2e uses a local server.
      - name: Start PostgreSQL
        run: |
          brew install -q postgresql@18
          pg=$(brew --prefix postgresql@18)/bin
          echo "$pg" >> "$GITHUB_PATH"
          printf '%s\n' connector-test-secret > "$RUNNER_TEMP/password"
          "$pg/initdb" -D "$RUNNER_TEMP/pg" -U postgres --pwfile="$RUNNER_TEMP/password" -A scram-sha-256
          "$pg/pg_ctl" -D "$RUNNER_TEMP/pg" -o "-p 5432 -k $RUNNER_TEMP" -l "$RUNNER_TEMP/pg.log" -w start
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      # Outside the Nix development shell, as a user runs it.
      - name: Check package
        env:
          POSTGRESQL_TEST_PORT: "5432"
        run: packaging/test/run-check.sh target/dist/*-osx_arm64.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-osx_arm64
          path: target/dist/*.tgz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the tag against the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "connector-api") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
      - name: Take the release notes from the changelog
        run: python3 packaging/release-notes.py "${GITHUB_REF_NAME#v}" CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
