[workspace]
members = [
    "crates/analytics-types",
    "crates/connector-sdk",
    "crates/connector-adbc",
    "crates/connector-sql",
    "crates/connector-odbc",
    "crates/connectors/postgresql",
    "crates/connectors/mysql",
    "crates/connectors/databricks",
    "crates/connectors/salesforce",
    "crates/connectors/sqlserver-odbc",
    "crates/connectors/salesforce/client",
    "crates/connector-api",
]
resolver = "3"

[workspace.package]
# The one version of the repository: every crate, the connector API library,
# and the DuckDB adapter release together under it.
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/scalar-labs/scalardb-analytics-connectors"

[workspace.dependencies]
adbc_core = "=0.25.0"
adbc_driver_manager = "=0.25.0"
adbc_ffi = "=0.25.0"
arrow-schema = "59.3.1"
arrow-array = "59.3.1"
arrow-buffer = "59.3.1"
arrow-data = "59.3.1"
cbindgen = { version = "=0.29.4", default-features = false }
analytics-types = { path = "crates/analytics-types" }
connector-sdk = { path = "crates/connector-sdk" }
connector-adbc = { path = "crates/connector-adbc" }
connector-sql = { path = "crates/connector-sql" }
connector-odbc = { path = "crates/connector-odbc" }
connector-postgresql = { path = "crates/connectors/postgresql" }
connector-mysql = { path = "crates/connectors/mysql" }
connector-databricks = { path = "crates/connectors/databricks" }
connector-salesforce = { path = "crates/connectors/salesforce" }
connector-sqlserver-odbc = { path = "crates/connectors/sqlserver-odbc" }
connector-salesforce-client = { path = "crates/connectors/salesforce/client" }
base64 = "0.22"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ring = "0.17"
rustls-pki-types = "1"
schemars = "1.2"
serde = "1.0"
serde_json = "1.0"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false }
url = "2"
wiremock = "0.6"
prost = "0.13.5"
prost-types = "0.13.5"
regress = "=0.10.4"
jsonschema = { version = "0.61", default-features = false }
substrait = "=0.55.0"
thiserror = "2.0"
toml = { version = "1.0.7", default-features = false, features = ["parse"] }
zeroize = "1.8"
