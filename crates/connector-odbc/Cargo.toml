[package]
name = "connector-odbc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ODBC access implementation for the connector SDK"

[dependencies]
# Keeps the arrow that arrow-odbc reads into on the workspace's arrow version.
arrow = { version = "59.3.1", default-features = false }
arrow-array.workspace = true
# Reads ODBC result sets as Arrow; its odbc-api links the ODBC driver manager.
# `wide` passes statements and connection strings to the driver as UTF-16, as
# on Windows, so that their text does not depend on the client's locale.
arrow-odbc = { version = "=27.0.0", features = ["wide"] }
arrow-schema.workspace = true
connector-sdk.workspace = true
futures-core.workspace = true

[dev-dependencies]
analytics-types.workspace = true
connector-sdk = { workspace = true, features = ["test-connector"] }
connector-sql.workspace = true

[lib]
path = "src/lib.rs"
