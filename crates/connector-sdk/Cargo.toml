[package]
name = "connector-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Source-independent ScalarDB Analytics connector SDK"

[features]
default = []
# An in-memory Connector that tests of the runtime and the connector API use.
test-connector = ["serde/derive"]
# The connector conformance suite that connector crates run from their tests.
conformance = ["dep:arrow-data"]

[dependencies]
analytics-types.workspace = true
arrow-array.workspace = true
# The conformance suite joins the batches of a read.
arrow-data = { workspace = true, optional = true }
# 256-bit decimals, and the nested Arrow arrays the test Connector builds.
arrow-buffer.workspace = true
# Remote executions carry their output schema as Arrow JSON across processes.
arrow-schema = { workspace = true, features = ["serde"] }
futures-core.workspace = true
prost.workspace = true
prost-types.workspace = true
# Keep Substrait's transitive regex engine compatible with the workspace MSRV.
regress.workspace = true
# Source metadata is a connector-defined type serialized for the Semantic Catalog.
serde.workspace = true
serde_json.workspace = true
substrait.workspace = true
thiserror.workspace = true
# Secret option values are erased when dropped.
zeroize.workspace = true

[dev-dependencies]
connector-sdk = { path = ".", features = ["test-connector"] }
serde = { workspace = true, features = ["derive"] }

[lib]
path = "src/lib.rs"
