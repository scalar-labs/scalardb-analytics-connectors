[package]
name = "connector-sql"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared processing for SQL-family connectors"

[dependencies]
analytics-types.workspace = true
arrow-array.workspace = true
# Planned reads carry their schemas as Arrow JSON across processes.
arrow-schema = { workspace = true, features = ["serde"] }
connector-adbc.workspace = true
connector-sdk.workspace = true
futures-core.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
substrait.workspace = true
thiserror.workspace = true

[dev-dependencies]
adbc_core.workspace = true
adbc_driver_manager.workspace = true
adbc_ffi.workspace = true
connector-sdk = { workspace = true, features = ["test-connector"] }

[lib]
path = "src/lib.rs"
