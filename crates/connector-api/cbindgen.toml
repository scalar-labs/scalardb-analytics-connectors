# Generates include/scalardb_analytics_connector.h from src/abi.
# The c_header test fails when the committed header differs from this output.
language = "C"
cpp_compat = true
include_guard = "SCALARDB_ANALYTICS_CONNECTOR_H"
style = "both"
documentation = true
documentation_style = "c99"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
header = """
/*
 * ScalarDB Analytics Connector C API.
 *
 * Generated by cbindgen from crates/connector-api/src/abi; do not edit.
 *
 * Conventions:
 * - A function that can fail returns NULL on success, or an error the caller
 *   frees with scalardb_analytics_connector_error_free.
 * - Input text is a NUL-terminated UTF-8 `const char*`.
 * - Output text is UTF-8 with a length and a NUL terminator after it, so
 *   `data` is usable as a C string; text from a Data Source that contains
 *   U+0000 is complete only through `length`. Absent output text has a NULL
 *   `data`.
 * - Text inside structures, in both directions, is a
 *   ScalardbAnalyticsConnectorString.
 * - Binary data, such as Substrait plans, carries a length and no terminator.
 * - The library copies every input during the call.
 * - A timeout of 0 milliseconds means no limit.
 * - An output structure tree passes to the caller, which frees it once with
 *   the free function named for its root; that frees the whole tree.
 */"""
after_includes = """

/*
 * Arrow C data and stream interfaces, as published by Apache Arrow.
 * https://arrow.apache.org/docs/format/CDataInterface.html
 * https://arrow.apache.org/docs/format/CStreamInterface.html
 */

#ifndef ARROW_C_DATA_INTERFACE
#define ARROW_C_DATA_INTERFACE

#define ARROW_FLAG_DICTIONARY_ORDERED 1
#define ARROW_FLAG_NULLABLE 2
#define ARROW_FLAG_MAP_KEYS_SORTED 4

struct ArrowSchema {
  const char* format;
  const char* name;
  const char* metadata;
  int64_t flags;
  int64_t n_children;
  struct ArrowSchema** children;
  struct ArrowSchema* dictionary;
  void (*release)(struct ArrowSchema*);
  void* private_data;
};

struct ArrowArray {
  int64_t length;
  int64_t null_count;
  int64_t offset;
  int64_t n_buffers;
  int64_t n_children;
  const void** buffers;
  struct ArrowArray** children;
  struct ArrowArray* dictionary;
  void (*release)(struct ArrowArray*);
  void* private_data;
};

#endif  /* ARROW_C_DATA_INTERFACE */

#ifndef ARROW_C_STREAM_INTERFACE
#define ARROW_C_STREAM_INTERFACE

struct ArrowArrayStream {
  int (*get_schema)(struct ArrowArrayStream*, struct ArrowSchema* out);
  int (*get_next)(struct ArrowArrayStream*, struct ArrowArray* out);
  const char* (*get_last_error)(struct ArrowArrayStream*);
  void (*release)(struct ArrowArrayStream*);
  void* private_data;
};

#endif  /* ARROW_C_STREAM_INTERFACE */"""

[parse]
parse_deps = false

[export.rename]
"FFI_ArrowArrayStream" = "struct ArrowArrayStream"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
