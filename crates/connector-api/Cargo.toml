[package]
name = "connector-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "C API implementation and connector assembly"

[features]
default = []
mysql = ["dep:connector-mysql"]
postgresql = ["dep:connector-postgresql"]
# Registers the SDK's in-memory Connector for this crate's ABI tests.
test-connector = ["connector-sdk/test-connector"]

[dependencies]
# Result streams cross the C ABI through the Arrow C stream interface.
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema.workspace = true
connector-sdk.workspace = true
connector-mysql = { workspace = true, optional = true }
connector-postgresql = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
cbindgen.workspace = true
connector-api = { path = ".", features = ["test-connector"] }
prost.workspace = true
substrait.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
